name: Build Android APK (manual)
# Only needed if you want an APK. The installable web app updates itself and does not need this.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node scripts/stamp.js
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Khata-$(node -p "require('./package.json').version").apk"
      - uses: actions/upload-artifact@v4
        with:
          name: khata-apk
          path: Khata-*.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release create "apk-v${V}-${GITHUB_RUN_NUMBER}" Khata-*.apk \
            --title "Khata APK ${V}" \
            --notes "Debug-signed Android build of Khata ${V}. Download the .apk on your phone and install it. Export a JSON backup before installing over an older APK."
